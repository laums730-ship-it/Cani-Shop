<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cani Shop tiene dirección nueva</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<meta http-equiv="refresh" content="12;url=https://canishop.pages.dev/">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#fdf1e7;color:#783746;font-family:Comfortaa,sans-serif;text-align:center}
.caja{max-width:420px;width:100%;background:#fff;border-radius:28px;padding:32px 24px 28px;box-shadow:0 10px 30px rgba(120,55,70,.12)}
img{width:150px;max-width:60%;height:auto}
h1{font-family:Fredoka,sans-serif;font-weight:600;font-size:26px;margin:14px 0 8px}
p{margin:0 0 18px;line-height:1.6;font-size:15px}
.dir{display:block;background:#fce3ee;border-radius:16px;padding:14px;font-family:Fredoka,sans-serif;font-size:20px;color:#783746;text-decoration:none;word-break:break-all;margin-bottom:18px}
.btn{display:inline-block;background:#fd95c8;color:#783746;font-family:Fredoka,sans-serif;font-size:18px;padding:13px 30px;border-radius:999px;text-decoration:none}
small{display:block;margin-top:16px;font-size:12px;opacity:.75}
</style>
</head>
<body>
<main class="caja">
  <img src="cani-sentado.webp" alt="Cani">
  <h1>¡Nos mudamos!</h1>
  <p>Cani Shop tiene una dirección nueva. Guárdala para volver cuando quieras.</p>
  <a class="dir" href="https://canishop.pages.dev/">canishop.pages.dev</a>
  <a class="btn" href="https://canishop.pages.dev/">Ir a la tienda</a>
  <small>Te llevamos solitas en unos segundos.</small>
</main>
</body>
</html>
