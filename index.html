<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cani Shop</title>
  <meta name="description" content="Cani Shop — productos kawaii, Sanrio, Snoopy y papelería. Envíos a toda Bolivia.">
  <meta name="theme-color" content="#f6f0ff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aviso">
    <img class="gato gato-izq" id="gato-izq" alt="">
    <button class="aviso-flecha" id="aviso-prev" aria-label="Anterior">‹</button>
    <span class="aviso-texto" id="aviso-texto"></span>
    <button class="aviso-flecha" id="aviso-sig" aria-label="Siguiente">›</button>
    <img class="gato gato-der" id="gato-der" alt="">
  </div>

  <header class="cabecera">
    <a href="#/" class="marca" aria-label="Inicio">
      <img id="logo" alt="">
      <span class="logo-texto" id="logo-texto"><span>Cani</span><span>Shop</span></span>
    </a>
    <nav class="menu" id="menu">
      <a href="#/">Inicio</a>
      <a href="#/catalogo">Catálogo</a>
      <a href="#/contacto">Contacto</a>
      <a href="#/nosotros">Nosotros</a>
    </nav>
    <div class="acciones">
      <button class="icono" id="btn-carrito" aria-label="Carrito">
        <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="contador" id="contador">0</span>
      </button>
      <button class="icono solo-movil" id="btn-menu" aria-label="Menú">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <div class="barra-busqueda">
    <label class="buscador">
      <input id="input-buscar" type="search" placeholder="¿Qué estás buscando?">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </label>
  </div>

  <main id="app"></main>

  <footer class="pie">
    <svg class="ola" viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0 30c120 25 240 25 360 0s240-25 360 0 240 25 360 0 240-25 360 0v30H0z"/></svg>
    <div class="pie-in">
      <div class="pie-marca">
        <strong id="pie-nombre"></strong>
        <p>Cositas kawaii con envíos a toda Bolivia 🐾</p>
      </div>
      <div class="pie-col">
        <h4>Tienda</h4>
        <a href="#/catalogo">Catálogo</a>
        <a href="#/nosotros">Nosotros</a>
        <a href="#/contacto">Contacto</a>
      </div>
      <div class="pie-col" id="pie-redes"><h4>Síguenos</h4></div>
    </div>
    <small class="pie-copy">© <span id="anio"></span> <span id="pie-nombre2"></span> · Hecho con 💜</small>
  </footer>

  <a class="wa-flotante" id="wa-flotante" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp">
    <svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6a10.6 10.6 0 0 1-5.4-1.5l-.4-.2-3.9 1 1-3.8-.2-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.3 6.3 0 0 0 1.3 3.3 14.4 14.4 0 0 0 5.5 4.9c2 .9 2.9 1 3.9.8a3.3 3.3 0 0 0 2.2-1.5 2.7 2.7 0 0 0 .2-1.5c-.1-.2-.3-.3-.7-.5z"/></svg>
  </a>

  <!-- Carrito -->
  <div class="velo" id="velo"></div>
  <aside class="carrito" id="carrito" aria-label="Carrito">
    <div class="carrito-cab">
      <h2>Tu carrito 🛍️</h2>
      <button class="icono" id="cerrar-carrito" aria-label="Cerrar">✕</button>
    </div>
    <div id="carrito-items" class="carrito-items"></div>
    <div class="carrito-pie" id="carrito-pie">
      <div class="total"><span>Subtotal</span><strong id="subtotal"></strong></div>
      <p class="nota">El envío y el pago (QR) se coordinan por WhatsApp.</p>
      <form id="form-pedido" class="form">
        <input name="nombre" placeholder="Tu nombre" required>
        <input name="telefono" type="tel" inputmode="tel" placeholder="Tu WhatsApp (ej: 71234567)" required>
        <input name="ciudad" placeholder="Ciudad" required>
        <select name="entrega" id="sel-entrega" required></select>
        <input name="direccion" placeholder="Dirección o punto de entrega">
        <textarea name="nota" rows="2" placeholder="Nota (opcional)"></textarea>
        <button class="btn btn-wa" type="submit">
          <svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3z"/></svg>
          Pedir por WhatsApp
        </button>
      </form>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="productos.js"></script>
  <script src="app.js"></script>
</body>
</html>
